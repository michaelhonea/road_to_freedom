{% extends "base.html" %}
{% block title %}Get Texts - {{ app_name }}{% endblock %}
{% block content %}
<h1>Get daily encouragement &amp; reminders</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form method="post" action="/join" class="form">
  <label>First name <input name="first_name" required maxlength="80"></label>
  <label>Last name <input name="last_name" maxlength="80"></label>
  <label>Mobile phone <input name="phone" type="tel" required placeholder="843-555-1234"></label>
  <label>Group
    <select name="group_id">
      <option value="">Not sure / none</option>
      {% for g in groups %}<option value="{{ g.id }}">{{ g.name }}</option>{% endfor %}
    </select>
  </label>
  <label class="check">
    <input type="checkbox" name="consent" value="yes" required>
    <span>I agree to receive text messages from {{ app_name }} / {{ church_name }} (daily notes and meeting
    reminders). Message frequency varies, up to about 1 per day. Msg &amp; data rates may apply. Reply STOP
    anytime to opt out, HELP for help. Consent is not a condition of participating. Your number is never
    shared or sold.</span>
  </label>
  <button class="btn" type="submit">Sign me up</button>
</form>
{% endblock %}
