<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Road to Freedom</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Crimson+Pro:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#14213d; --gold:#c9a227; --gold-light:#e8d48b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:var(--navy); color:#f4f1e8; font-family:'Crimson Pro',serif; font-size:20px; padding:16px; }
    .card { width:100%; max-width:380px; text-align:center; padding:32px 24px;
            border:1px solid var(--gold); border-radius:8px; }
    h1 { font-family:'Cinzel',serif; color:var(--gold); font-size:28px; margin:0 0 8px; }
    p { margin:0 0 20px; color:var(--gold-light); }
    input, button { width:100%; font:inherit; padding:12px; border-radius:6px; border:1px solid var(--gold); }
    input { background:#0e1830; color:#fff; margin-bottom:12px; text-align:center; }
    button { background:var(--gold); color:var(--navy); font-weight:600; cursor:pointer; }
    .error { color:#ff9b9b; min-height:1.4em; margin:0 0 12px; }
  </style>
</head>
<body>
  <form class="card" method="post" action="/login">
    <h1>Road to Freedom</h1>
    <p>Enter your group access code.</p>
    <div class="error">{{error}}</div>
    <input type="password" name="code" placeholder="Access code" autocomplete="current-password" required autofocus>
    <button type="submit">Enter</button>
  </form>
</body>
</html>
